const MODES=[['normal','Normal'],['duo','Duplas'],['dvd','Dupla contra dupla']],DT={k:'Assassinos',m:'Monstros',d:'Detetives'},DTD={k:'Assassinos: Assassino e Metamorfo',m:'Monstros: Monstro e Barulhento (a Sentinela)',d:'Detetives: dois detetives normais'};
function lobbyNH(){return 1+Object.keys(NET.peers).length}

 if(NET.mode=='normal')return;const n=lobbyDuoCount();let t=(NET.types||[]).slice(0,n);const def=['k','d','m'];
 while(t.length<n)t.push(def[t.length]||'m');

function createRoom(){

 bind(ch,{
  join:p=>{if(S||typeof p.id!='string'||p.id.length>20)return;
   let q=NET.peers[p.id];
   if(!q){if(Object.keys(NET.peers).length>=MAXP-1)return send('full',{id:p.id});

   keycap(s[0],s[1]-34,'E','segure')}
  const ng=nearGate(P);if(ng>=0&&!PZ)keycap(P.x,P.y-56,'E','resolver o enigma');
  if(!PZ&&Math.hypot(P.x-BTN.x,P.y-BTN.y)<80)keycap(BTN.x,BTN.y-52,'E',P.btnUsed?'botão já usado':S.btnCd>0?'disponível em '+Math.ceil(S.btnCd)+'s':'chamar reunião');
  if(P.role=='k'&&!PZ){const vn=nearNode(P,60);if(vn&&roomIdx(P)===vn.i)keycap(vn.x,vn.y-46,'V','entrar no duto')}
  const nb=nearB(P,70);if(nb){keycap(nb.x,nb.y-30,'R','reportar');if(P.role=='d')keycap(nb.x,nb.y-60,'F','investigar')}
  if(P.role=='k'&&P.kcd<=0){const v=near(P,S.ch.filter(c=>c.alive&&c.role!='k'&&roomIdx(c)==roomIdx(P)),60);if(v)keycap(v.x,v.y-48,'Espaço','eliminar')}}
 if(P.role=='d')S.bodies.forEach(b=>{g.fillStyle='#ffbe55';g.font='700 22px '+FD;g.textAlign='center';g.fillText('!',b.x,b.y-24+(RM?0:Math.sin(T*5)*3))});
 g.restore();
 arrows();
 hud(P,F,T)
}

function step(t){const dt=Math.min(.05,(t-(S?S.last:t))/1000);if(S)S.last=t;
 if(S&&NET&&!NET.host)guestTick(dt);else upd(dt);
 if(S&&NET&&NET.host)hostTick(dt)}
